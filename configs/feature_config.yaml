# Feature engineering configuration

rolling:
  # Overall rolling windows (match-count-based)
  windows: [5, 10]
  # Home/away-specific rolling windows (smaller due to fewer venue-specific matches)
  venue_windows: [3, 6]
  # Minimum periods for rolling calculations
  min_periods: 1

elo:
  k_factor: 20
  initial_rating: 1500
  home_advantage: 100

odds:
  # Primary odds columns (H/D/A triplets)
  primary: [B365H, B365D, B365A]
  pinnacle_opening: [PSH, PSD, PSA]
  pinnacle_closing: [PSCH, PSCD, PSCA]
  # Additional bookmakers for multi-book analysis (>85% coverage)
  additional_books:
    bw: [BWH, BWD, BWA]
    wh: [WHH, WHD, WHA]
    vc: [VCH, VCD, VCA]
    iw: [IWH, IWD, IWA]
  # Columns with >90% null to drop before feature engineering
  drop_columns:
    - SJH
    - SJD
    - SJA
    - BFH
    - BFD
    - BFA
    - 1XBH
    - 1XBD
    - 1XBA
    - BFEH
    - BFED
    - BFEA
    - "BFE>2.5"
    - "BFE<2.5"
    - BFEAHH
    - BFEAHA
    - BFCH
    - BFCD
    - BFCA
    - 1XBCH
    - 1XBCD
    - 1XBCA
    - BFECH
    - BFECD
    - BFECA
    - "BFEC>2.5"
    - "BFEC<2.5"
    - BFECAHH
    - BFECAHA
    - HFKC
    - AFKC

  # Over/Under 2.5 odds (2-way pairs)
  ou25_books:
    b365_ou25: ["B365>2.5", "B365<2.5"]
    ps_ou25: ["P>2.5", "P<2.5"]
    max_ou25: ["Max>2.5", "Max<2.5"]
    avg_ou25: ["Avg>2.5", "Avg<2.5"]

  # Corner match result odds (3-way triplets)
  corner_books:
    b365_corner: [B365CH, B365CD, B365CA]
    max_corner: [MaxCH, MaxCD, MaxCA]
    avg_corner: [AvgCH, AvgCD, AvgCA]

match_context:
  # Matches considered "early season" (limited rolling data)
  early_season_threshold: 5
  # Cap rest days at this value (handles summer/winter breaks)
  summer_break_threshold: 60

# Leagues with xG data from Understat
tier1_leagues:
  - EPL
  - La_Liga
  - Bundesliga
  - Serie_A
  - Ligue_1
